  <!-- Écran de chargement : visible tout de suite, même sur une connexion lente, jusqu'à l'affichage de l'appli. -->
  <div id="ctv-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#080F43;z-index:9;transition:opacity .4s">
    <img src="icons/Icon-192.png" alt="Conacce TV" width="96" height="96" style="border-radius:22px">
    <div style="display:flex;gap:10px;align-items:center;color:#C9D2F5;font:14px system-ui,sans-serif">
      <span style="width:18px;height:18px;border:2px solid #F9CA22;border-right-color:transparent;border-radius:50%;animation:ctvsp .8s linear infinite"></span>
      <span id="ctv-splash-t">Chargement de Conacce TV…</span>
    </div>
    <style>@keyframes ctvsp{to{transform:rotate(360deg)}}</style>
  </div>
  <script>
  (function () {
    var sp = document.getElementById('ctv-splash');
    function hide() { if (!sp) return; sp.style.opacity = '0'; setTimeout(function () { sp && sp.remove(); sp = null; }, 450); }
    window.addEventListener('flutter-first-frame', hide);
    setTimeout(function () { var t = document.getElementById('ctv-splash-t'); if (t && sp) t.textContent = 'Connexion lente · encore un instant…'; }, 8000);
    setTimeout(hide, 60000);
  })();
  </script>
  <!-- Lecture des directs et programmes (.m3u8) : hls.js (copié sur notre propre adresse, chargé sans bloquer

      var vod = /videodelivery\.net|\/videos?\//i.test(url);

        liveSyncDurationCount: 4,       // marge de 4 segments derrière le direct
