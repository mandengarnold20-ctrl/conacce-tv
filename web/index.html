<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Conacce TV — télévision en direct, Radio Dunamis FM, cultes et Œuvres d’Or.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080F43">

  <!-- iPhone : « Ajouter à l'écran d'accueil » ouvre l'appli en plein écran -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Conacce TV">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Conacce TV</title>
  <style>
    html, body { margin: 0; height: 100%; background: #080F43; }
  </style>
</head>
<body>
  <!-- Lecture des directs (.m3u8) dans Chrome, Edge, Firefox et les TV : hls.js prend le relais
       quand le navigateur ne sait pas lire ce format tout seul (Safari sur iPhone le lit nativement). -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script>
  (function () {
    var desc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');
    if (!desc || !window.Hls || !Hls.isSupported()) return;
    function attach(el, url) {
      if (el.__hls) { el.__hls.destroy(); el.__hls = null; el.__hlsSrc = null; }
      // iPhone (iOS 17.1+) compris : hls.js gère mieux les coupures réseau que le lecteur natif.
      if (typeof url !== 'string' || !/\.m3u8(\?|$)/i.test(url)) return false;
      // Programme enregistré (Cloudflare videodelivery) : grosse réserve d'avance pour ne jamais saccader.
      var vod = /videodelivery\.net|\/videos?\//i.test(url);
      var hls = new Hls({
        lowLatencyMode: false,          // un peu plus de retard, beaucoup moins de coupures
        liveSyncDurationCount: 4,       // marge de 4 segments derrière le direct
        liveMaxLatencyDurationCount: 12,
        capLevelToPlayerSize: true,     // qualité adaptée à la taille de l'écran
        maxBufferLength: vod ? 120 : 30,
        maxMaxBufferLength: vod ? 600 : 60,
        backBufferLength: 30,
        manifestLoadingMaxRetry: 20, manifestLoadingRetryDelay: 1000,
        levelLoadingMaxRetry: 20, levelLoadingRetryDelay: 1000,
        fragLoadingMaxRetry: 20, fragLoadingRetryDelay: 1000
      });
      hls.on(Hls.Events.ERROR, function (_, d) {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) setTimeout(function () { hls.startLoad(); }, 1000);
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      });
      el.__hls = hls; el.__hlsSrc = url;
      hls.loadSource(url);
      hls.attachMedia(el);
      return true;
    }
    Object.defineProperty(HTMLMediaElement.prototype, 'src', {
      configurable: true, enumerable: desc.enumerable,
      get: function () { return this.__hlsSrc || desc.get.call(this); },
      set: function (v) { if (!attach(this, v)) desc.set.call(this, v); }
    });
    // Les petites erreurs que hls.js répare tout seul ne doivent pas arrêter le lecteur de l'appli.
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t.__hls && t instanceof HTMLMediaElement) { e.stopImmediatePropagation(); }
    }, true);
    var setAttr = Element.prototype.setAttribute;
    Element.prototype.setAttribute = function (name, value) {
      if (this instanceof HTMLMediaElement && String(name).toLowerCase() === 'src') { this.src = value; return; }
      return setAttr.call(this, name, value);
    };
  })();
  </script>
  <!-- Plein écran de la vidéo avec le lecteur du téléphone (appelé par le bouton ⛶) -->
  <script>
  // ─── Chaîne programmée 24 h/24 (liens YouTube) ───
  // Lecteur sans boutons, calé sur l'horaire du serveur. La vidéo suivante se prépare
  // par-dessus, invisible, et n'apparaît que lorsqu'elle joue déjà : pas de chargement à l'écran.
  (function () {
    var api = null, host = null, queued = null, cur = null;
    window.conacceTvMuted = false;
    function loadApi() {
      if (api) return api;
      api = new Promise(function (res) {
        if (window.YT && YT.Player) return res();
        var prev = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = function () { if (prev) prev(); res(); };
        var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
      });
      return api;
    }
    function destroy(e) {
      if (!e) return;
      try { if (e.player && e.player.destroy) e.player.destroy(); } catch (x) {}
      if (e.wrap && e.wrap.parentNode) e.wrap.parentNode.removeChild(e.wrap);
    }
    window.conacceTvHost = function (el) {
      host = el;
      if (queued) { var q = queued; queued = null; window.conacceTvPlay(q[0], q[1], q[2]); }
    };
    window.conacceTvPlay = function (id, start, key) {
      if (!host) { queued = [id, start, key]; return; }
      var h = host, t0 = performance.now();
      loadApi().then(function () {
        if (h !== host) return;
        var wrap = document.createElement('div');
        wrap.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;transition:opacity .35s;background:#000';
        var el = document.createElement('div'); wrap.appendChild(el); h.appendChild(wrap);
        var entry = { key: key, wrap: wrap, player: null, shown: false }, previous = cur;
        cur = entry;
        function expected() { return start + (performance.now() - t0) / 1000; }
        function reveal() {
          if (entry.shown || cur !== entry) return;
          entry.shown = true; wrap.style.opacity = '1';
          if (previous) { var old = previous; previous = null; setTimeout(function () { destroy(old); }, 400); }
        }
        entry.player = new YT.Player(el, {
          width: '100%', height: '100%', videoId: id,
          playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, playsinline: 1, rel: 0, start: Math.floor(start), origin: location.origin },
          events: {
            onReady: function (e) { if (window.conacceTvMuted) e.target.mute(); e.target.playVideo(); },
            onAutoplayBlocked: function (e) { window.conacceTvMuted = true; e.target.mute(); e.target.playVideo(); },
            onStateChange: function (e) {
              if (e.data === 1) {
                // Même image partout : on rattrape un éventuel retard de chargement.
                var gap = e.target.getCurrentTime() - expected();
                if (Math.abs(gap) > 8) e.target.seekTo(expected(), true);
                reveal();
              } else if (e.data === 0) {
                wrap.style.opacity = '0';  // fin de vidéo : écran noir propre jusqu'au programme suivant
              }
            }
          }
        });
        setTimeout(reveal, 7000);
      });
    };
    window.conacceTvStop = function (key) {
      if (!cur || (key && cur.key !== key)) return;
      destroy(cur); cur = null;
    };
    window.conacceTvUnmute = function () {
      window.conacceTvMuted = false;
      try { if (cur && cur.player) { cur.player.unMute(); cur.player.setVolume(100); cur.player.playVideo(); } } catch (x) {}
    };
  })();
  // ─── Chaîne programmée (vidéos envoyées) : UN lecteur pour toute la visite ───
  // Les deux écrans vidéo sont créés une seule fois et ne sont jamais détruits :
  // - changement de programme : la vidéo suivante est préparée à l'avance sur le 2e écran, puis on bascule ;
  // - changement de page : la TV continue en coulisse (sans le son), on la retrouve sans rechargement ;
  // - le son, autorisé une fois par un toucher, reste autorisé.
  (function () {
    var host = null, park = null, vids = [], cur = 0, want = false, muted = false, t0 = 0, start0 = 0;
    var spin = null, chip = null, stallT = null, lastSeek = 0, lastPos = -1, still = 0, awayT = null, waitT = null;
    function now() { return performance.now(); }
    function expected() { return start0 + (now() - t0) / 1000; }
    function mk() {
      var v = document.createElement('video');
      v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', ''); v.playsInline = true;
      v.preload = 'auto'; v.autoplay = false; v.controls = false;
      v.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity .35s';
      v.addEventListener('waiting', function () { if (v === vids[cur]) { clearTimeout(waitT); waitT = setTimeout(function () { if (spin && v === vids[cur] && (v.paused || v.readyState < 3)) spin.style.display = 'flex'; }, 1500); } });
      v.addEventListener('playing', function () { if (v === vids[cur]) { clearTimeout(waitT); if (spin) spin.style.display = 'none'; v.style.opacity = '1'; } });
      // Un déplacement de l'écran (page qui se réorganise, téléphone tourné) peut mettre la vidéo en pause : elle repart aussitôt.
      v.addEventListener('pause', function () { if (v === vids[cur] && want && !v.ended) setTimeout(function () { if (want && v.paused) doPlay(v); }, 60); });
      return v;
    }
    function ensure() {
      if (vids.length) return;
      park = document.createElement('div');
      park.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:0;pointer-events:none;z-index:-1';
      document.body.appendChild(park);
      vids = [mk(), mk()];
      spin = document.createElement('div');
      spin.style.cssText = 'position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none';
      spin.innerHTML = '<div style="padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.6);color:#C9D2F5;font:12px Poppins,sans-serif;display:flex;gap:8px;align-items:center"><span style="width:16px;height:16px;border:2px solid #F9CA22;border-right-color:transparent;border-radius:50%;animation:ctvspin .8s linear infinite"></span>Chargement…</div>';
      chip = document.createElement('div');
      chip.style.cssText = 'position:absolute;left:50%;top:8px;transform:translateX(-50%);display:none;padding:5px 10px;border-radius:14px;background:rgba(0,0,0,.6);color:#fff;font:12px Poppins,sans-serif;pointer-events:none';
      chip.textContent = '🔇 Touchez pour le son';
      var st = document.createElement('style'); st.textContent = '@keyframes ctvspin{to{transform:rotate(360deg)}}'; document.head.appendChild(st);
      [vids[0], vids[1], spin, chip].forEach(function (e) { park.appendChild(e); });
    }
    // Les écrans vont dans la TV quand elle est affichée, sinon dans une « coulisse » invisible (jamais retirés de la page).
    function place() {
      var target = host && host.isConnected ? host : park;
      [vids[0], vids[1], spin, chip].forEach(function (e) { if (e.parentNode !== target) target.appendChild(e); });
      if (target === host) { vids[cur].muted = muted; if (chip) chip.style.display = muted ? 'block' : 'none'; }
      if (want && vids[cur].paused) doPlay(vids[cur]);
    }
    function waitConnected() {
      var h = host, n = 0;
      (function poll() { if (h !== host) return; if (h.isConnected) return place(); if (n++ < 100) setTimeout(poll, 30); })();
    }
    function doPlay(v) {
      v.muted = muted || !host || !host.isConnected;
      var p = v.play();
      if (p && p.catch) p.catch(function (e) {
        if (e && e.name === 'NotAllowedError') { muted = true; v.muted = true; v.play().catch(function () {}); }
      });
      if (chip) chip.style.display = muted && host && host.isConnected ? 'block' : 'none';
    }
    function show(v) {
      var other = vids[1 - cur];
      v.style.opacity = '1';
      if (other !== v) { other.style.opacity = '0'; setTimeout(function () { if (other !== vids[cur]) other.pause(); }, 400); }
    }
    function seekTo(v, s) { try { if (isFinite(s) && s > 0.5 && (!v.duration || s < v.duration - 1)) v.currentTime = s; } catch (e) {} lastSeek = now(); }
    function load(v, url) {
      v.__u = url; v.__ready = false;
      v.addEventListener('loadedmetadata', function once() { v.removeEventListener('loadedmetadata', once); v.__ready = true; if (v === vids[cur]) { seekTo(v, expected()); doPlay(v); } }, { once: true });
      v.src = url;
      try { v.load && !v.__hls && v.load(); } catch (e) {}
    }
    // Premier toucher : le son est autorisé pour les deux écrans, une fois pour toutes.
    function unlock() {
      ensure();
      muted = false;
      vids.forEach(function (v) {
        if (v === vids[cur] && want) { v.muted = !host || !host.isConnected; v.play().catch(function () {}); }
        else if (v.__u) { var was = v.muted; v.muted = true; v.play().then(function () { if (v !== vids[cur]) v.pause(); v.muted = was; }).catch(function () {}); }
      });
      if (chip) chip.style.display = 'none';
    }
    document.addEventListener('pointerdown', unlock, true);
    document.addEventListener('touchend', unlock, true);
    window.conacceFileHost = function (el) {
      ensure(); host = el; clearTimeout(awayT); waitConnected();
    };
    window.conacceFilePlay = function (url, startSec, key) {
      ensure(); want = true; clearTimeout(awayT);
      t0 = now(); start0 = startSec;
      var v = vids[cur];
      if (v.__u === url) {
        if (Math.abs(v.currentTime - expected()) > 12 && v.__ready) seekTo(v, expected());
        if (v.paused) doPlay(v);
        show(v); place(); return;
      }
      var o = vids[1 - cur];
      if (o.__u === url) {            // déjà préparée : bascule immédiate
        cur = 1 - cur;
        if (o.__ready) { seekTo(o, expected()); doPlay(o); }
        show(o); v.style.opacity = '0'; setTimeout(function () { v.pause(); }, 400);
        place(); return;
      }
      v.style.opacity = '0';
      clearTimeout(waitT); waitT = setTimeout(function () { if (spin && v === vids[cur] && v.paused) spin.style.display = 'flex'; }, 1500);
      load(v, url); place();
    };
    // Prépare le programme suivant sur l'écran libre (quelques dizaines de secondes avant).
    window.conacceFilePreload = function (url) {
      ensure();
      var o = vids[1 - cur];
      if (o.__u === url) return;
      o.pause(); o.muted = true; o.style.opacity = '0';
      load(o, url);
    };
    // La TV quitte l'écran (autre page) : elle continue sans le son quelques minutes, puis se met en pause.
    window.conacceFileAway = function () {
      host = null; if (!vids.length) return;
      place();
      vids[cur].muted = true;
      clearTimeout(awayT);
      awayT = setTimeout(function () { want = false; vids.forEach(function (v) { v.pause(); }); }, 5 * 60 * 1000);
    };
    window.conacceFileUnmute = function () { unlock(); };
    // Surveillance douce : recalage sur l'horaire et relance après un long blocage.
    setInterval(function () {
      if (!vids.length || !want) return;
      var v = vids[cur];
      if (!v.__ready) return;
      if (v.paused && !v.ended) doPlay(v);
      var pos = v.currentTime;
      if (Math.abs(pos - lastPos) < 0.05) still++; else still = 0;
      lastPos = pos;
      if (!v.paused && Math.abs(pos - expected()) > 20 && now() - lastSeek > 60000) seekTo(v, expected());
      if (still >= 8 && v.__u) { still = 0; var u = v.__u; v.__u = null; load(v, u); }  // ≈ 40 s sans image : on recharge
    }, 5000);
  })();
  // Mini-écran (image dans l'image) : la TV continue dans une petite fenêtre
  // pendant qu'on utilise d'autres applis.
  function conacceVideo() {
    var vs = document.querySelectorAll('video'), best = null;
    for (var i = 0; i < vs.length; i++) { var v = vs[i]; if (!best || (!v.paused && best.paused) || v.clientWidth > best.clientWidth) best = v; }
    return best;
  }
  window.conaccePipSupported = function () {
    return !!(document.pictureInPictureEnabled || (window.HTMLVideoElement && HTMLVideoElement.prototype.webkitSetPresentationMode));
  };
  window.conaccePip = function () {
    try {
      if (document.pictureInPictureElement) { document.exitPictureInPicture(); return; }
      var v = conacceVideo(); if (!v) return;
      if (v.webkitSupportsPresentationMode && typeof v.webkitSetPresentationMode === 'function') {
        v.webkitSetPresentationMode(v.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
        return;
      }
      if (v.requestPictureInPicture) v.requestPictureInPicture().catch(function () {});
    } catch (e) {}
  };
  // Quand on quitte l'appli pendant la TV, le navigateur peut passer seul en mini-écran.
  new MutationObserver(function () {
    var vs = document.querySelectorAll('video:not([autopictureinpicture])');
    for (var i = 0; i < vs.length; i++) { vs[i].setAttribute('autopictureinpicture', ''); try { vs[i].autoPictureInPicture = true; } catch (e) {} }
  }).observe(document.documentElement, { childList: true, subtree: true });
  // iPhone : les vidéos restent dans l'appli (jamais le lecteur plein écran d'Apple),
  // pour que le logo et le bandeau restent toujours collés à l'image.
  new MutationObserver(function (ms) {
    ms.forEach(function (m) { m.addedNodes.forEach(function (n) {
      var vs = n.tagName === 'VIDEO' ? [n] : (n.querySelectorAll ? n.querySelectorAll('video') : []);
      for (var i = 0; i < vs.length; i++) { vs[i].setAttribute('playsinline', ''); vs[i].setAttribute('webkit-playsinline', ''); vs[i].playsInline = true; }
    }); });
  }).observe(document.documentElement, { childList: true, subtree: true });
  window.conacceFullscreen = function () {
    var v = document.querySelector('video');
    if (!v) return;
    if (v.webkitEnterFullscreen) { v.webkitEnterFullscreen(); return; }
    if (v.requestFullscreen) { v.requestFullscreen(); return; }
    if (v.webkitRequestFullscreen) v.webkitRequestFullscreen();
  };
  </script>
  <!-- Supprime l'ancienne version gardée en mémoire par le navigateur (mise à jour immédiate) -->
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      if (!rs.length) return;
      Promise.all(rs.map(function (r) { return r.unregister(); }))
        .then(function () { return window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }) : null; })
        .then(function () { try { if (!sessionStorage.getItem('maj')) { sessionStorage.setItem('maj', '1'); location.reload(); } } catch (e) {} });
    });
  }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
