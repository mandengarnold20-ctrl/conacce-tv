<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080F43">
<title>Conacce TV — Administration</title>
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --night: #050A2E; --plum: #0B1463; --deep: #080F43; --violet: #F9CA22; --vivid: #FA5304;
    --lilac: #F9CA22; --pale: #FFE7A3; --mist: #DCE3FF; --live: #E5002B; --ok: #2BD488;
    --card: rgba(11,20,99,.55); --line: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Poppins, system-ui, sans-serif; color: #fff; font-size: 15px;
    background: linear-gradient(180deg, #0D2389 0%, #0B1463 40%, #050A2E 100%);
    background-attachment: fixed;
  }
  a { color: var(--pale); }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 34px;
       letter-spacing: 1px; text-transform: uppercase; margin: 0; line-height: 1.1; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .muted { color: var(--mist); }
  .hidden { display: none !important; }

  /* Boutons */
  .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: #fff;
         padding: 10px 16px; border-radius: 12px; cursor: pointer; white-space: nowrap; min-height: 44px; }
  .btn:hover { border-color: var(--lilac); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn.primary { background: linear-gradient(90deg, #F9CA22, #F9B91B 30%, #FD9113 60%, #FC6306 85%, #FA5304); border: none; color: #0B1463; }
  .btn.white { background: #fff; color: var(--deep); border: none; }
  .btn.danger { color: #FF8A9B; }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 6px 12px; min-height: 36px; font-size: 13px; }

  /* Connexion */
  .center { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login { width: 100%; max-width: 420px; background: rgba(8,15,67,.85); border: 1px solid var(--line);
           border-radius: 24px; padding: 32px; backdrop-filter: blur(10px); }
  .logo { display: block; width: 240px; margin: 0 auto 12px; border-radius: 4px; }
  .login p { color: var(--mist); line-height: 1.6; }

  /* Mise en page */
  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
  nav.side { background: linear-gradient(180deg, #0B1463, #080F43); border-right: 1px solid var(--line); padding: 20px 12px;
             position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  nav.side .brand { text-align: center; padding: 0 0 16px; }
  nav.side .brand img { width: 160px; border-radius: 4px; }
  nav.side .brand div { font-family: 'Barlow Condensed'; font-style: italic; font-weight: 700; letter-spacing: 3px;
                        color: var(--lilac); font-size: 14px; }
  nav.side button.nav { font: inherit; text-align: left; background: none; border: none; color: var(--mist);
                        padding: 11px 14px; border-radius: 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
  nav.side button.nav:hover { background: var(--card); color: #fff; }
  nav.side button.nav.on { background: linear-gradient(90deg, #F9CA22, #FD9113); color: #0B1463; font-weight: 700; }
  nav.side .spacer { flex: 1; }
  nav.side .who { font-size: 12px; color: var(--mist); padding: 8px 14px; word-break: break-all; }
  main { padding: 28px clamp(16px, 4vw, 48px) 80px; max-width: 1150px; width: 100%; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .intro { color: var(--mist); margin: 6px 0 0; max-width: 640px; line-height: 1.5; }

  /* Listes */
  input, select, textarea { font: inherit; color: #fff; background: rgba(255,255,255,.07); border: 1px solid var(--line);
                            border-radius: 12px; padding: 11px 14px; width: 100%; min-height: 44px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--lilac); outline-offset: 0; border-color: transparent; }
  select option { background: var(--plum); }
  textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
  input[type=checkbox] { width: 22px; height: 22px; min-height: 0; accent-color: var(--vivid); }
  .search { margin-bottom: 14px; }
  .list { display: grid; gap: 10px; }
  .item { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; background: var(--card);
          border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
  .item .thumb { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: linear-gradient(135deg, var(--vivid), var(--deep));
                 display: grid; place-items: center; font-size: 26px; overflow: hidden; }
  .item .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .item .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { color: var(--mist); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .acts { display: flex; gap: 6px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--deep); color: var(--pale); margin-right: 4px; }
  .badge.red { background: var(--live); color: #fff; }
  .badge.green { background: #0d5c3c; color: #b9ffe0; }
  .empty { padding: 40px 20px; text-align: center; color: var(--mist); background: var(--card); border-radius: 16px; border: 1px dashed var(--line); }
  .bad { color: #FF8A9B; }

  /* Formulaire */
  .overlay { position: fixed; inset: 0; background: rgba(5,0,10,.7); z-index: 50; display: flex; justify-content: flex-end; }
  .drawer { width: min(640px, 100%); height: 100%; background: var(--plum); border-left: 1px solid var(--line);
            display: flex; flex-direction: column; animation: slide .2s ease-out; }
  @keyframes slide { from { transform: translateX(40px); opacity: 0; } }
  .drawer header { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .drawer header h2 { margin: 0; font-size: 19px; }
  .drawer .body { padding: 20px 22px; overflow-y: auto; flex: 1; }
  .drawer footer { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; }
  .fld { margin-bottom: 18px; }
  .fld > label { display: block; font-weight: 600; margin-bottom: 6px; }
  .fld .req { color: var(--lilac); }
  .fld .help { font-size: 12.5px; color: var(--mist); margin-top: 5px; line-height: 1.45; }
  .check { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

  /* Envoi de fichier */
  .up { border: 1px dashed var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
  .up .prev img { max-width: 100%; max-height: 180px; border-radius: 10px; display: block; }
  .up .prev video { width: 100%; max-height: 220px; border-radius: 10px; background: #000; }
  .up .prev audio { width: 100%; }
  .up .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .up .bar { height: 6px; border-radius: 6px; background: var(--card); overflow: hidden; display: none; }
  .up.busy .bar { display: block; }
  .up .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--lilac), var(--vivid)); transition: width .2s; }

  /* Pistes de playlist */
  .tracks { display: grid; gap: 6px; margin-bottom: 8px; }
  .track { display: flex; gap: 8px; align-items: center; background: var(--card); border-radius: 10px; padding: 6px 6px 6px 12px; }
  .track span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track button { font: inherit; background: none; border: none; color: var(--mist); cursor: pointer; padding: 6px 8px; border-radius: 8px; }
  .track button:hover { background: var(--card); color: #fff; }

  /* Tableau de bord */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
  .stat .n { font-family: 'Barlow Condensed'; font-style: italic; font-weight: 800; font-size: 42px; line-height: 1; }
  .stat .l { color: var(--mist); font-size: 13px; margin-top: 6px; }
  .stat.hl { background: linear-gradient(90deg, #F9CA22, #FD9113 60%, #FA5304); border: none; color: #0B1463; }
  .stat.hl .l { color: #0B1463; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 180px; padding-top: 10px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; height: 100%; }
  .chart .b { width: 100%; max-width: 26px; background: linear-gradient(180deg, var(--lilac), var(--violet)); border-radius: 5px 5px 0 0; min-height: 2px; }
  .chart .d { font-size: 10px; color: var(--mist); margin-top: 4px; height: 14px; }
  .two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  .rank { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .rank:last-child { border: none; }
  .quick { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .note { background: rgba(199,116,255,.1); border: 1px solid rgba(199,116,255,.35); border-radius: 14px; padding: 14px 16px; line-height: 1.6; color: var(--pale); margin-bottom: 18px; }
  .live-on { background: rgba(229,0,43,.15); border-color: var(--live); }

  /* Message */
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 99; background: #fff; color: var(--deep);
           font-weight: 600; padding: 12px 20px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: calc(100% - 32px); display: none; }
  #toast.bad { background: var(--live); color: #fff; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    nav.side { position: sticky; top: 0; z-index: 20; height: auto; flex-direction: row; overflow-x: auto; padding: 8px; border-right: none; border-bottom: 1px solid var(--line); gap: 2px; }
    nav.side .brand, nav.side .spacer, nav.side .who { display: none; }
    nav.side button.nav { white-space: nowrap; padding: 9px 12px; font-size: 14px; }
    main { padding-top: 20px; }
    .two, .grid2 { grid-template-columns: 1fr; }
    .item { grid-template-columns: 52px 1fr; }
    .item .thumb { width: 52px; height: 52px; }
    .item .acts { grid-column: 1 / -1; justify-content: flex-end; }
    h1 { font-size: 28px; }
  }
  /* ─── Finition « tableau de bord » : plus fin, plus structuré ─── */
  body { font-size: 14px; line-height: 1.55; background: #070D3A; }
  h1 { font-family: Poppins, system-ui, sans-serif; font-style: normal; text-transform: none; letter-spacing: 0;
       font-weight: 600; font-size: 23px; line-height: 1.3; }
  h2 { font-size: 15px; font-weight: 600; }
  .btn { font-size: 13.5px; font-weight: 500; padding: 7px 14px; min-height: 36px; border-radius: 6px; }
  .btn.small { padding: 4px 10px; min-height: 30px; font-size: 12.5px; }
  .btn.primary { font-weight: 600; }
  input, select, textarea { border-radius: 6px; padding: 8px 12px; min-height: 38px; background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.14); }
  input:focus, select:focus, textarea:focus { outline: 2px solid rgba(249,202,34,.6); }
  input[type=checkbox] { width: 18px; height: 18px; }

  .app { grid-template-columns: 224px 1fr; }
  nav.side { background: #050A2E; padding: 0 0 12px; gap: 0; border-right: 1px solid rgba(255,255,255,.06); }
  nav.side .brand { padding: 18px 16px 14px; border-bottom: 1px solid rgba(255,255,255,.06); margin-bottom: 8px; }
  nav.side .brand img { width: 132px; }
  nav.side .brand div { font-family: Poppins, sans-serif; font-style: normal; font-weight: 600; font-size: 10.5px; letter-spacing: 2.5px; margin-top: 6px; }
  nav.side button.nav { font-size: 13.5px; padding: 9px 16px; border-radius: 0; gap: 10px; border-left: 3px solid transparent; color: #C9D2F5; }
  nav.side button.nav span { width: 18px; text-align: center; font-size: 14px; filter: saturate(.6); }
  nav.side button.nav:hover { background: rgba(255,255,255,.05); color: #fff; }
  nav.side button.nav.on { background: rgba(249,202,34,.12); color: #F9CA22; font-weight: 600; border-left-color: #F9CA22; }
  nav.side .who { font-size: 11.5px; padding: 8px 16px; }
  nav.side .group { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: #7F8BC4; padding: 14px 16px 4px; font-weight: 600; }
  @media (max-width: 900px) { nav.side .group { display: none; } }

  .content { min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 46px; display: flex; align-items: center; gap: 18px; padding: 0 clamp(16px, 4vw, 40px);
            background: #050A2E; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13px; color: #C9D2F5; position: sticky; top: 0; z-index: 10; }
  .topbar b { color: #fff; font-weight: 600; }
  .topbar a { color: #C9D2F5; text-decoration: none; }
  .topbar a:hover { color: #F9CA22; }
  .topbar .grow { flex: 1; }
  main { padding: 24px clamp(16px, 4vw, 40px) 80px; }
  .head { align-items: center; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .head .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .intro { font-size: 13.5px; margin-top: 4px; }

  .list { gap: 0; border: 1px solid rgba(255,255,255,.08); border-radius: 8px; overflow: hidden; background: rgba(8,15,67,.55); }
  .item { border: none; border-radius: 0; border-bottom: 1px solid rgba(255,255,255,.06); background: transparent; padding: 10px 14px; grid-template-columns: 52px 1fr auto; }
  .item:last-child { border-bottom: none; }
  .item:hover { background: rgba(255,255,255,.03); }
  .item .thumb { width: 52px; height: 52px; border-radius: 6px; font-size: 20px; }
  .item .t { font-weight: 600; font-size: 14px; }
  .item .s { font-size: 12.5px; }
  .item .acts { opacity: .85; }
  .item:hover .acts { opacity: 1; }
  .badge { font-weight: 600; border-radius: 4px; padding: 1px 7px; }
  .empty { border-radius: 8px; }
  .list > .empty { border: none; }

  .panel, .stat { border-radius: 8px; background: rgba(8,15,67,.6); border-color: rgba(255,255,255,.08); }
  .stat .n { font-family: Poppins, sans-serif; font-style: normal; font-weight: 600; font-size: 30px; }
  .stat .l { font-size: 12.5px; }
  .note { border-radius: 4px; border: none; border-left: 4px solid #F9CA22; background: rgba(249,202,34,.07); font-size: 13.5px; color: #E9EDFF; }
  .check { border-radius: 6px; padding: 10px 12px; font-weight: 500; }
  .fld > label { font-weight: 500; font-size: 13.5px; }
  .drawer { background: #0A1250; }
  .drawer header h2 { font-size: 17px; font-weight: 600; }
  .up { border-radius: 8px; }
  .login { border-radius: 12px; }
  #toast { border-radius: 8px; font-weight: 500; }

  /* Galerie : envoi de plusieurs photos */
  .bulk { display: flex; gap: 8px; align-items: center; }
  .bulk select { width: auto; min-width: 170px; }
  .progress { margin: -6px 0 14px; font-size: 13px; color: #C9D2F5; }

  @media (max-width: 900px) {
    .content { display: block; }
    .topbar { display: none; }
    nav.side { padding: 6px; }
    nav.side button.nav { border-left: none; border-radius: 6px; padding: 8px 10px; }
    .item { grid-template-columns: 46px 1fr; }
    .item .thumb { width: 46px; height: 46px; }
    h1 { font-size: 20px; }
  }
  /* ─── Régie TV : studio sombre ─── */
  @keyframes sunflow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .sun, .st .sun { background: linear-gradient(110deg, #F9CA22 0%, #FD7A13 35%, #FFB347 60%, #F9CA22 100%); background-size: 300% 100%; animation: sunflow 9s ease-in-out infinite; color: #0B1463; }
  @media (prefers-reduced-motion: reduce) { .sun { animation: none; } }
  .app.studio { display: block; }
  .app.studio > nav.side, .app.studio .topbar { display: none; }
  .app.studio main { padding: 0; max-width: none; }
  .st { min-height: 100vh; background: #060A22; color: #EEF1FF; font-family: Inter, Poppins, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; }
  .st h2 { font-family: Poppins, sans-serif; font-size: 17px; font-weight: 700; margin: 0; }
  .st h3 { font-family: Poppins, sans-serif; font-size: 15px; margin: 18px 0 8px; }
  .st .grow { flex: 1 1 auto; }
  .st input, .st select, .st textarea { background: #080D2B; border-color: rgba(255,255,255,.14); border-radius: 10px; }
  .st .btn { border-radius: 10px; background: #121A45; border-color: rgba(255,255,255,.14); }
  .st .btn.primary, .st .btn.sun-btn { background: linear-gradient(110deg, #F9CA22 0%, #FD7A13 35%, #FFB347 60%, #F9CA22 100%); background-size: 300% 100%; animation: sunflow 9s ease-in-out infinite; color: #0B1463; border: none; font-weight: 800; }
  .st .btn.ghost { background: transparent; }
  .st-top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 10px 18px; background: #080D2B; border-bottom: 1px solid rgba(255,255,255,.08); position: sticky; top: 0; z-index: 20; }
  .st-brand { display: flex; align-items: center; gap: 10px; }
  .st-brand small { font-size: 11px; letter-spacing: 2.4px; font-weight: 700; color: #F9CA22; }
  .st-logo { display: inline-flex; border-radius: 8px; overflow: hidden; font-family: Poppins, sans-serif; font-weight: 800; font-size: 18px; line-height: 1; }
  .st-logo > span { padding: 7px 8px 7px 10px; background: #0B1463; color: #fff; }
  .st-logo > span.sun { padding: 7px 10px; color: #0B1463; }
  .st-pill { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 12px; letter-spacing: 1.2px;
             background: rgba(255,59,92,.14); border: 1px solid rgba(255,59,92,.45); }
  .st-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #FF3B5C; animation: pulse 1.6s ease-in-out infinite; }
  .st-pill.paused { background: rgba(249,202,34,.12); border-color: rgba(249,202,34,.45); } .st-pill.paused .st-live-dot { background: #F9CA22; }
  .st-pill.stopped { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.2); } .st-pill.stopped .st-live-dot { background: #8C97CC; animation: none; }
  .st-clock { font-family: Poppins, sans-serif; font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .st-saved { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #B9C3EE; } .st-saved svg { color: #6EE7A8; flex: none; }
  .st-bell { position: relative; width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: #0E1436; color: #EEF1FF; display: grid; place-items: center; cursor: pointer; }
  .st-bell b { position: absolute; top: 5px; right: 5px; min-width: 16px; height: 16px; border-radius: 8px; background: #FD7A13; color: #0B1463; font-size: 10px; display: grid; place-items: center; }
  .st-me { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border-radius: 999px; background: #0E1436; border: 1px solid rgba(255,255,255,.1); }
  .st-me > span.sun { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; }
  .st-me > span:last-child { display: flex; flex-direction: column; line-height: 1.2; } .st-me b { font-size: 13px; } .st-me small { font-size: 11px; color: #F9CA22; }
  .st-out { width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: transparent; color: #C9D2F5; display: grid; place-items: center; cursor: pointer; }
  .st-out:hover, .st-bell:hover { border-color: #F9CA22; }
  .st-body { display: flex; flex-wrap: wrap; flex: 1 1 auto; min-height: 0; }
  .st-rail { flex: 1 1 180px; max-width: 210px; display: flex; flex-direction: column; gap: 4px; padding: 16px 10px; background: #080D2B; border-right: 1px solid rgba(255,255,255,.08); }
  .st-nav { font: inherit; display: flex; align-items: center; gap: 10px; padding: 11px 12px; min-height: 44px; border-radius: 10px; border: none; background: none; color: #C9D2F5; cursor: pointer; text-align: left; }

// ─── Champs de formulaire ───
let uploading = 0;

function upload(bucket, file, onProgress) {
  return new Promise(async (resolve, reject) => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return reject(new Error('Session expirée : reconnectez-vous.'));
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin';
    const base = norm(file.name.replace(/\.[^.]+$/, '')).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'fichier';
    const path = `${new Date().getFullYear()}/${Date.now()}-${base}.${ext}`;
    const x = new XMLHttpRequest();
    x.open('POST', `${SB_URL}/storage/v1/object/${bucket}/${path}`);
    x.setRequestHeader('Authorization', 'Bearer ' + session.access_token);
    x.setRequestHeader('apikey', SB_KEY);
    x.setRequestHeader('x-upsert', 'false');
    x.setRequestHeader('cache-control', 'max-age=31536000');
    x.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    x.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    x.onload = () => {
      if (x.status < 300) return resolve(`${SB_URL}/storage/v1/object/public/${bucket}/${path}`);
      let m = x.responseText; try { m = JSON.parse(m).message || m; } catch (_) {}
      if (/exceeded the maximum|too large|413/i.test(m + x.status)) m = `Fichier trop lourd (maximum ${MAX_MB} Mo).`;
      else if (/row-level security|Unauthorized|403/i.test(m + x.status)) m = 'Envoi refusé : votre compte n’a pas les droits administrateur.';
      else if (/Bucket not found/i.test(m)) m = 'Le dossier de stockage n’est pas encore créé.';
      reject(new Error(m));
    };
    x.onerror = () => reject(new Error('Connexion interrompue pendant l’envoi.'));
    x.send(file);
  });
}

function readDuration(file) {
  return new Promise(res => {
    const el = document.createElement(file.type.startsWith('video') ? 'video' : 'audio');
    el.preload = 'metadata';
    el.onloadedmetadata = () => { res(isFinite(el.duration) ? Math.round(el.duration) : null); URL.revokeObjectURL(el.src); };
    el.onerror = () => res(null);
    el.src = URL.createObjectURL(file);
  });
}

function uploader(f, vals, changed, form) {
  const isImg = f.type === 'image';
  const wrap = h('div', { class: 'up' });
  const prev = h('div', { class: 'prev' });
  const bar = h('div', { class: 'bar' }, h('i'));
  const link = h('input', { type: 'url', placeholder: '…ou collez un lien (https://…)', inputmode: 'url' });
  const input = h('input', { type: 'file', accept: isImg ? 'image/*' : f.accept, hidden: true });
  const pick = h('button', { type: 'button', class: 'btn', onclick: () => input.click() }, isImg ? 'Choisir une image' : 'Choisir un fichier');
  const clear = h('button', { type: 'button', class: 'btn ghost small', onclick: () => set(null) }, 'Retirer');
  link.value = vals[f.k] || '';
  function draw() {
    prev.textContent = '';
    const u = vals[f.k];
    clear.classList.toggle('hidden', !u);
    if (!u) return prev.append(h('span', { class: 'muted' }, 'Aucun fichier pour le moment.'));
    if (isImg) prev.append(h('img', { src: u, alt: '' }));
    else if (/\.m3u8(\?|$)/i.test(u)) prev.append(h('span', { class: 'muted' }, 'Lien de diffusion en streaming'));
    else if (f.media === 'audio') prev.append(h('audio', { src: u, controls: true, preload: 'none' }));
    else if (f.media === 'pdf') prev.append(h('a', { href: u, target: '_blank' }, 'Ouvrir le PDF'));
    else prev.append(h('video', { src: u, controls: true, preload: 'metadata', playsinline: true }));
  }
  function set(u) { vals[f.k] = u || null; link.value = u || ''; draw(); changed(f.k); }
  link.addEventListener('change', () => set(link.value.trim()));
  input.addEventListener('change', async () => {
    const file = input.files[0]; input.value = '';
    if (!file) return;
    if (file.size > MAX_MB * 1024 * 1024) return toast(`Fichier trop lourd (${(file.size / 1048576).toFixed(0)} Mo). Maximum ${MAX_MB} Mo : compressez-le ou collez un lien.`, true);
    if (!isImg && f.media !== 'pdf' && form) {
      readDuration(file).then(d => {
        const dur = form.querySelector('[name=duration]');
        if (d && dur && !vals.duration) { vals.duration = d; dur.value = d; }
      });
    }
    uploading++; pick.disabled = true; wrap.classList.add('busy'); bar.firstChild.style.width = '0%';
    pick.textContent = 'Envoi en cours…';
    try {
      set(await upload(f.bucket || 'images', file, p => { bar.firstChild.style.width = Math.round(p * 100) + '%'; pick.textContent = `Envoi… ${Math.round(p * 100)} %`; }));
      toast('Fichier envoyé');
    } catch (e) { toast(e.message, true); }
    finally { uploading--; pick.disabled = false; wrap.classList.remove('busy'); pick.textContent = isImg ? 'Choisir une image' : 'Choisir un fichier'; }
  });
  draw();
  wrap.append(prev, h('div', { class: 'row' }, pick, clear), bar, link, input);
  return wrap;
}

function options(sel, list, value, emptyLabel) {
  if (emptyLabel) sel.append(h('option', { value: '' }, emptyLabel));
  for (const [v, l] of list) { const o = h('option', { value: v }, l); if (v === value) o.selected = true; sel.append(o); }
  return sel;
}

function tracksEditor(vals) {
  const box = h('div');
  const list = h('div', { class: 'tracks' });
  const add = options(h('select'), REFS.media, null, '+ Ajouter un titre…');
  const name = id => (REFS.media.find(m => m[0] === id) || [id, 'Titre supprimé'])[1];
  function draw() {
    list.textContent = '';
    if (!vals._tracks.length) list.append(h('div', { class: 'muted' }, 'Aucun titre. Choisissez-en dans la liste ci-dessous.'));
    vals._tracks.forEach((id, i) => list.append(h('div', { class: 'track' },
      h('span', {}, `${i + 1}. ${name(id)}`),
      h('button', { type: 'button', title: 'Monter', onclick: () => { if (i) { [vals._tracks[i - 1], vals._tracks[i]] = [vals._tracks[i], vals._tracks[i - 1]]; draw(); } } }, '▲'),
      h('button', { type: 'button', title: 'Descendre', onclick: () => { if (i < vals._tracks.length - 1) { [vals._tracks[i + 1], vals._tracks[i]] = [vals._tracks[i], vals._tracks[i + 1]]; draw(); } } }, '▼'),
      h('button', { type: 'button', title: 'Retirer', onclick: () => { vals._tracks.splice(i, 1); draw(); } }, 'Retirer'))));
  }
  add.addEventListener('change', () => { if (add.value && !vals._tracks.includes(add.value)) vals._tracks.push(add.value); add.value = ''; draw(); });
  draw();
  box.append(list, REFS.media.length ? add : h('div', { class: 'help' }, 'Ajoutez d’abord des titres dans « Musiques & clips ».'));
  return box;
}

/** Construit les champs dans [container] ; renvoie une fonction qui met à jour l'affichage conditionnel. */
function renderFields(fields, vals, container) {
  const wrappers = [];
  const refresh = () => wrappers.forEach(([f, w]) => w.classList.toggle('hidden', !!f.show && !f.show(vals)));
  const changed = k => {
    if (k === 'target_type') { vals.target_id = null; rebuildTarget(); }
    refresh();
  };
  let rebuildTarget = () => {};
  for (const f of fields) {
    const w = h('div', { class: 'fld' });
    let ctl;
    switch (f.type) {
      case 'checkbox': {
        const cb = h('input', { type: 'checkbox', name: f.k });
        cb.checked = !!vals[f.k];
        cb.addEventListener('change', () => { vals[f.k] = cb.checked; changed(f.k); });
        w.append(h('label', { class: 'check' }, cb, f.label));
        break;
      }
      case 'textarea':
        ctl = h('textarea', { name: f.k, rows: f.rows || 4 }); ctl.value = vals[f.k] || '';
        ctl.addEventListener('input', () => { vals[f.k] = ctl.value; });
        break;
      case 'select':
        ctl = options(h('select', { name: f.k }), f.opts, vals[f.k]);
        ctl.addEventListener('change', () => { vals[f.k] = ctl.value; changed(f.k); });
        break;
      case 'ref':
        ctl = options(h('select', { name: f.k }), REFS[f.ref], vals[f.k], '— Aucun —');
        ctl.addEventListener('change', () => { vals[f.k] = ctl.value || null; changed(f.k); });
        break;
      case 'target': {
        ctl = h('div');
        rebuildTarget = () => {
          ctl.textContent = '';
          const ref = TARGET_REF[vals.target_type];
          if (!ref) return;
          const s = options(h('select', { name: f.k }), REFS[ref], vals.target_id, '— Choisissez —');
          s.addEventListener('change', () => { vals.target_id = s.value || null; });
          ctl.append(s);
        };
        rebuildTarget();
        break;
      }
      case 'number':
        ctl = h('input', { type: 'number', name: f.k, min: 0, inputmode: 'numeric' }); ctl.value = vals[f.k] ?? '';
        ctl.addEventListener('input', () => { vals[f.k] = ctl.value === '' ? null : Number(ctl.value); });
        break;
      case 'date':
        ctl = h('input', { type: 'date', name: f.k }); ctl.value = (vals[f.k] || '').slice(0, 10);
        ctl.addEventListener('change', () => { vals[f.k] = ctl.value || null; });
        break;
      case 'datetime':
        ctl = h('input', { type: 'datetime-local', name: f.k }); ctl.value = toLocal(vals[f.k]);
        ctl.addEventListener('change', () => { vals[f.k] = fromLocal(ctl.value); });
        break;
      case 'image': case 'file':
        ctl = uploader(f, vals, changed, container);
        break;
      case 'duration': {

        });
        ctl = h('div', { style: 'display:flex;gap:8px;align-items:center' }, inp, btn);
        break;
      }
      case 'links': {
        ctl = h('div', { class: 'grid2' });

          const i = h('input', { type: 'url', placeholder: l + ' (https://…)', 'aria-label': l });
          i.value = vals[f.k][k] || '';
          i.addEventListener('input', () => { vals[f.k][k] = i.value.trim(); });
          ctl.append(h('div', { class: 'fld' }, i));
        }
        break;
      }
      case 'tracks':
        ctl = tracksEditor(vals);
        break;
      default:
        ctl = h('input', { type: f.type === 'url' ? 'url' : 'text', name: f.k, inputmode: f.type === 'url' ? 'url' : null });
        ctl.value = vals[f.k] || '';

    if (ctl) w.append(h('label', {}, f.label, f.req ? h('span', { class: 'req' }, ' *') : null), ctl);
    if (f.help) w.append(h('div', { class: 'help' }, f.help));
    wrappers.push([f, w]);
    container.append(w);
  }
  refresh();
}

/** Vérifie et prépare les valeurs à enregistrer. Renvoie [payload, message d'erreur]. */
function collect(fields, vals, validate) {
  const visible = f => !f.show || f.show(vals);
  for (const f of fields) {
    const v = vals[f.k];
    if (f.req && visible(f) && (v == null || String(v).trim() === '')) return [null, `« ${f.label} » est obligatoire.`];
    if (f.type === 'url' && v && visible(f) && !/^https?:\/\//i.test(v.trim())) return [null, `« ${f.label} » doit commencer par https://`];
  }
  const payload = {};
  for (const f of fields) {
    if (f.k.startsWith('_')) continue;
    let v = vals[f.k];
    if (!visible(f)) {
      // Deux champs pour la même donnée (ex. catégorie) : on garde celui qui est affiché.
      if (fields.some(g => g !== f && g.k === f.k && visible(g))) continue;
      v = f.type === 'checkbox' ? false : (f.def ?? null);
    }
    if (f.type === 'checkbox') v = !!v;
    else if (f.type === 'links') v = Object.fromEntries(Object.entries(v || {}).filter(([, x]) => x));
    else if (typeof v === 'string') { v = v.trim(); if (v === '') v = null; }
    if (v === undefined) v = null;
    if (f.type === 'number' && v == null && f.def != null) v = f.def;
    payload[f.k] = v;
  }
  const err = validate && validate(payload);
  return err ? [null, err] : [payload, null];
}

// ─── Fenêtre d'ajout / modification ───
async function openForm(key, row) {
  const E = ENT[key];
  const vals = row ? { ...row } : {};
  if (!row) for (const f of E.fields) if (f.def !== undefined) vals[f.k] = typeof f.def === 'object' ? { ...f.def } : f.def;
  if (key === 'playlists') {
    vals._tracks = [];
    if (row) {
      const { data } = await sb.from('playlist_items').select('media_id,position').eq('playlist_id', row.id).order('position');
      vals._tracks = (data || []).map(r => r.media_id);
    }
  }
  const body = h('div', { class: 'body' });
  const saveBtn = h('button', { class: 'btn primary', onclick: save }, row ? 'Enregistrer' : 'Ajouter');
  const close = () => { overlay.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => e.key === 'Escape' && close();
  const overlay = h('div', { class: 'overlay', onclick: e => e.target === overlay && close() },
    h('div', { class: 'drawer', role: 'dialog', 'aria-modal': 'true' },
      h('header', {}, h('h2', {}, (row ? 'Modifier ' : 'Ajouter ') + E.one), h('button', { class: 'btn ghost small', onclick: close, 'aria-label': 'Fermer' }, 'Retirer')),
      body,
      h('footer', {}, h('button', { class: 'btn ghost', onclick: close }, 'Annuler'), saveBtn)));
  document.addEventListener('keydown', esc);
  document.body.append(overlay);
  renderFields(E.fields, vals, body);
  body.querySelector('input:not([type=checkbox]):not([type=file]), textarea')?.focus();

  async function save() {
    if (uploading) return toast('Patientez : un fichier est encore en cours d’envoi.', true);
    const [payload, err] = collect(E.fields, vals, E.validate);
    if (err) return toast(err, true);
    saveBtn.disabled = true; saveBtn.textContent = 'Enregistrement…';
    try {
      const why = E.check && await E.check(payload, row);
      if (why) { toast(why, true); saveBtn.disabled = false; saveBtn.textContent = row ? 'Enregistrer' : 'Ajouter'; return; }
      const q = row ? sb.from(E.table).update(payload).eq('id', row.id) : sb.from(E.table).insert(payload);
      const { data, error } = await q.select('id').single();
      if (error) throw error;
      if (key === 'playlists') {
        const del = await sb.from('playlist_items').delete().eq('playlist_id', data.id);
        if (del.error) throw del.error;
        if (vals._tracks.length) {
          const ins = await sb.from('playlist_items').insert(vals._tracks.map((media_id, position) => ({ playlist_id: data.id, media_id, position })));
          if (ins.error) throw ins.error;
        }
      }
      close();
      toast(row ? 'Modifications enregistrées.' : 'Ajouté, visible dans l’appli.');
      await loadRefs();
      show(key);
    } catch (e) {
      toast(friendly(e), true);
      saveBtn.disabled = false; saveBtn.textContent = row ? 'Enregistrer' : 'Ajouter';
    }
  }
}

// Photos : réduites dans le navigateur (envoi rapide, même en 3G), puis enregistrées une par une.
async function shrinkImage(file, max = 2000) {
  if (!/^image\/(jpeg|png|webp)$/i.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 1.5e6) return file;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    return blob ? new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
  } catch (_) { return file; }
}

function bulkBox(key) {
  const album = h('select', {}, ALBUMS.map(([v, l]) => h('option', { value: v }, l)));
  const input = h('input', { type: 'file', accept: 'image/*', multiple: true, class: 'hidden' });
  const btn = h('button', { class: 'btn primary', type: 'button', onclick: () => input.click() }, 'Envoyer des photos');
  input.addEventListener('change', async () => {
    const files = [...input.files]; input.value = '';
    if (!files.length) return;
    const where = label(ALBUMS, album.value);
    let ok = 0, fail = 0;
    btn.disabled = true; uploading++;
    const status = h('div', { class: 'progress' });
    $('#main .head').after(status);
    for (const [i, f] of files.entries()) {
      status.textContent = `Envoi ${i + 1} / ${files.length} dans « ${where} »…`;
      try {
        const url = await upload('images', await shrinkImage(f), () => {});
        const { error } = await sb.from('gallery_photos').insert({ album: album.value, image_url: url });
        if (error) throw error;
        ok++;
      } catch (e) { fail++; console.warn(e); }
    }
    uploading--; btn.disabled = false; status.remove();
    toast(fail ? `${ok} photo(s) ajoutée(s), ${fail} en échec.` : `${ok} photo(s) ajoutée(s) dans « ${where} ».`, !!fail && !ok);
    if (current === key) show(key);

}

// La grille : exactement le même calcul que l'appli (heure du serveur, boucle + rendez-vous).
function tvSchedule(programs, anchorMs) {
  const ok = programs.filter(p => p.is_active !== false && p.duration > 0);
  const fixed = ok.filter(p => p.start_at);
  const loop = ok.filter(p => !p.start_at).sort((a, b) => (a.position - b.position) || (a.id < b.id ? -1 : 1));
  const around = t => {
    const out = [];
    for (const p of fixed) {
      const s = Date.parse(p.start_at), d = p.duration * 1000;
      const step = p.repeat_daily ? DAY_MS : p.repeat_weekly ? 7 * DAY_MS : 0;
      if (!step) { out.push({ p, start: s, end: s + d }); continue; }
      const k = Math.trunc((t - s) / step);
      for (const n of [k - 1, k, k + 1]) { if (n < 0) continue; const st = s + n * step; out.push({ p, start: st, end: st + d }); }
    }
    return out;
  };
  const nextFixed = t => { let b = null; for (const sl of around(t)) if (sl.start > t && (!b || sl.start < b.start)) b = sl; return b; };
  const at = t => {
    let cur = null;
    for (const sl of around(t)) if (t >= sl.start && t < sl.end && (!cur || sl.start > cur.start)) cur = sl;
    if (cur) return cur;
    if (!loop.length) return null;
    const total = loop.reduce((a, p) => a + p.duration * 1000, 0);
    let x = ((t - anchorMs) % total + total) % total;
    for (const p of loop) {
      const d = p.duration * 1000;
      if (x < d) { const start = t - x; let end = start + d; const n = nextFixed(t); if (n && n.start < end) end = n.start; return { p, start, end }; }
      x -= d;
    }
    return null;
  };
  return { at, after: sl => at(sl.end + 500), nextFixed, loop, fixed, empty: !ok.length };
}

// Envoi direct vers Cloudflare Stream (protocole tus, par morceaux de 64 Mo, reprise automatique).
function tusPatch(url, blob, offset, onProg) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PATCH', url);
    x.setRequestHeader('Tus-Resumable', '1.0.0');
    x.setRequestHeader('Upload-Offset', String(offset));
    x.setRequestHeader('Content-Type', 'application/offset+octet-stream');
    x.upload.onprogress = e => onProg(e.loaded);
    x.onload = () => x.status >= 200 && x.status < 300 ? res(Number(x.getResponseHeader('Upload-Offset')) || offset + blob.size) : rej(new Error('HTTP ' + x.status));
    x.onerror = () => rej(new Error('réseau'));
    x.send(blob);
  });
}
async function tusUpload(url, file, onProg) {
  const CH = 64 * 1024 * 1024; let off = 0, fails = 0;
  while (off < file.size) {
    try {
      const base = off;
      off = await tusPatch(url, file.slice(off, off + CH), off, l => onProg((base + l) / file.size));
      fails = 0; onProg(off / file.size);
    } catch (e) {
      if (++fails > 6) throw e;
      await new Promise(r => setTimeout(r, 2000 * fails));
      try { const r = await fetch(url, { method: 'HEAD', headers: { 'Tus-Resumable': '1.0.0' } }); const o = Number(r.headers.get('Upload-Offset')); if (o >= 0 && !isNaN(o) && r.headers.get('Upload-Offset') !== null) off = o; } catch (_) {}
    }
  }
}

}

        if (!moved && Math.abs(dx) < 5) return;
        moved = true; el.classList.add('dragging');
        t = dayStart(R.day) + Math.round(((left0 + dx / w * 100) / 100 * DAY_MS) / SNAP) * SNAP;
        t = Math.max(dayStart(R.day), Math.min(dayStart(R.day) + DAY_MS - SNAP, t));
        el.style.left = ((t - dayStart(R.day)) / DAY_MS * 100) + '%';
        showMark(t, hm(t) + ' · ' + b.p.title);
      };
      const up = () => {
        window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
        hideMark(); el.classList.remove('dragging');
        if (moved) { el.__noClick = true; setTimeout(() => { el.__noClick = false; }, 50); placeAt(b.p, t); }
      };
      window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
    });
    el.addEventListener('click', e => { if (el.__noClick) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  }

  // ── Modèles de journées ──
  const snap = p => ({ title: p.title, source: p.source, video_url: p.video_url, duration: p.duration, kind: p.kind || 'clip', artist: p.artist || null, song: p.song || null, show_band: p.show_band !== false });
  const dayModel = i => dayItems(i).filter(it => !it.p.repeat_daily).map(it => ({ minute: Math.round((it.at - dayStart(i)) / 60000), ...snap(it.p) }));
  async function applyItems(items, i) {
    const s0 = dayStart(i), have = dayItems(i);

    }

  // ── Notifications sur l'ordinateur pour les alertes graves ──
  let lastSerious = new Set();

    if (window.Notification && Notification.permission === 'granted') {

  // ── Affichage des listes ──

  // ── Alertes ──
  function drawAlerts() {
    const out = [], S = R.sched, st = R.channel.status;
    if (S.empty) out.push(['bad', 'Aucun programme : les spectateurs voient l’écran d’attente. Ajoutez des vidéos à la playlist.']);
    else {
      if (st === 'stopped') out.push(['bad', 'Chaîne arrêtée : les spectateurs voient l’écran d’attente. Touchez « Lecture » pour la relancer.']);
      if (st === 'paused') out.push(['warn', 'Chaîne en pause : les spectateurs voient « Nous revenons dans un instant ».']);
      if (!S.loop.length) {
        const gaps = dayBlocks(dayIdx(now())).filter(b => b.kind === 'gap' && b.to > now());
        if (gaps.length) out.push(['warn', `Playlist en boucle vide : ${gaps.length} trou${gaps.length > 1 ? 's' : ''} aujourd’hui (prochain à ${hm(Math.max(gaps[0].from, now()))}). Ajoutez des vidéos à la playlist pour les combler.`, '#programmes']);
      }
    }
    if (R.liveIdle) out.push(['warn', 'Direct allumé, mais OBS / vMix n’envoie aucune image : la programmation reste à l’antenne.', '#directs']);
    const prep = R.programs.filter(p => p.source === 'file' && R.ready[p.id] === false).length;
    if (prep) out.push(['info', `${prep} vidéo${prep > 1 ? 's' : ''} encore en préparation chez Cloudflare : elle${prep > 1 ? 's' : ''} passera${prep > 1 ? 'ont' : ''} dès qu’elle${prep > 1 ? 's seront prêtes' : ' sera prête'}.`]);
    // Boucle de sécurité : ce qui tourne quand rien n'est programmé.
    const loopDur = S.empty ? 0 : S.loop.reduce((a, p) => a + p.duration, 0);
    const planned = [0, 1, 2, 3, 4, 5, 6].filter(i => dayItems(i).length).length;
    if (S.loop.length && loopDur < 2 * 3600) out.push(['warn', `Réserve basse : la playlist en boucle ne dure que ${fmtLong(loopDur)}, elle se répète souvent. Ajoutez des vidéos (objectif : au moins 24 h).`, '#programmes']);
    const uniq = new Map(); for (const p of R.programs) uniq.set(p.video_url, p.duration);
    const total = [...uniq.values()].reduce((a, d) => a + d, 0);
    if (!S.empty && total < 24 * 3600) out.push(['info', `${fmtLong(total)} de programmes différents. Objectif : 24 h, pour éviter que la boucle se répète trop souvent.`]);
    alerts.textContent = ''; alertsFull.textContent = '';
    const serious = out.filter(a => a[0] !== 'info').length;
    if (!out.length) out.push(['ok', 'Tout va bien : la chaîne tourne sans trou.']);
    const item = ([k, msg, link]) => h('div', { class: 'st-alert ' + k }, icon(k === 'ok' ? 'ok' : k === 'info' ? 'info' : 'warn', 16), h('span', {}, msg),
      link ? h('a', { href: link, onclick: e => { e.preventDefault(); window.__regieShow(link); } }, 'Voir') : null);
    const top = out.filter(a => a[0] !== 'info');
    for (const a of (top.length ? top : [['ok', 'Tout va bien : la chaîne tourne sans trou.' + (out.some(a => a[0] === 'info') ? ' Conseils dans l’onglet « Alertes ».' : ''), out.some(a => a[0] === 'info') ? '#alertes' : null]])) alerts.append(item(a));
    for (const a of out) alertsFull.append(item(a));
    const nb = notifBtn(); if (nb) alertsFull.append(nb);
    notifyNew(out);
    F.bellN.textContent = String(serious); F.bellN.classList.toggle('hidden', !serious);
    F.bell.setAttribute('aria-label', serious ? `Alertes : ${serious}` : 'Aucune alerte');
    F.reserve.classList.remove('hidden'); F.reserve.textContent = '';
    F.reserve.append(h('small', {}, 'BOUCLE DE SÉCURITÉ'), h('b', {}, fmtLong(loopDur)),
      h('span', { class: 'rg-bar' + (loopDur < 2 * 3600 ? ' low' : '') }, h('i', { style: `width:${Math.min(100, loopDur / 864)}%` })),
      h('small', {}, `objectif : 24 h · ${fmtLong(total)} de vidéos différentes`),
      h('small', {}, `Plan : ${planned}/7 jours avec rendez-vous`));
  }

  function editTime(r, p, it) {
    const inp = h('input', { type: 'time', value: hm(it.at), 'aria-label': 'Nouvelle heure' });
    const cell = r.querySelector('.n'); cell.textContent = ''; cell.append(inp); inp.focus();

    const save = async () => {
      if (done) return; done = true;
      if (!/^\d\d:\d\d$/.test(inp.value) || inp.value === hm(it.at)) return draw();
      const [a, b] = inp.value.split(':').map(Number);
      const base = p.repeat_daily || p.repeat_weekly ? Date.parse(p.start_at) : it.at;
      const t = startOfDay(base) + (a * 60 + b) * 60000;
      const { error } = await sb.from('tv_programs').update({ start_at: new Date(t).toISOString() }).eq('id', p.id);
      if (error) toast(friendly(error), true); else toast('Heure changée : ' + inp.value);
      reload();
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') { done = true; draw(); } });
    inp.addEventListener('blur', save);
  }

  // ── Actions ──
  async function control(action) {

    toast({ play: 'La chaîne est à l’antenne.', pause: 'Chaîne en pause : « Nous revenons dans un instant ».', stop: 'Chaîne arrêtée.', restart: 'La playlist reprend au premier programme.', clear: 'Programmation supprimée. Une copie est gardée dans « Équipe et sauvegarde ».' }[action]);

  function slotPlanner(where) {
    let pos = R.programs.filter(p => !p.start_at).reduce((a, p) => Math.max(a, p.position || 0), 0);
    let t = where === 'week' ? chosenStart() : 0;
    const weekly = R.weekly;
    return dur => {
      if (where === 'loop') return { position: ++pos, start_at: null, repeat_daily: false, repeat_weekly: false };
      const st = t; t += dur * 1000;
      return { position: 0, start_at: new Date(st).toISOString(), repeat_daily: false, repeat_weekly: weekly };
    };
  }

    if (error) throw error;

  async function addFiles(where, files) {
    const UI = where === 'loop' ? R.loopUI : R.weekUI;
    const plan = slotPlanner(where);
    const jobs = [];
    for (const f of files) {
      const duration = await readDuration(f);
      jobs.push({ f, duration, title: f.name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').trim(), slot: duration ? plan(duration) : null });
    }
    let okN = 0;
    for (const [i, j] of jobs.entries()) {
      const pc = h('i'); const txt = h('span', {}, `${i + 1}/${jobs.length} · ${j.title} · préparation…`);
      const line = h('div', {}, txt, pc); UI.ups.append(line);
      const setP = x => { pc.style.setProperty('--p', Math.round(x * 100) + '%'); txt.textContent = `${i + 1}/${jobs.length} · ${j.title} · ${Math.round(x * 100)} %`; };
      try {
        const { data, error } = await sb.functions.invoke('tv-upload', { body: { size: j.f.size, name: j.f.name, duration: j.duration || 0 } });
        if (error) {
          let why = ''; try { why = (await error.context.json()).error; } catch (_) {}
          if (why === 'not_configured' || /Failed to send|not found|404/i.test(String(error.message) + why) || !why) { line.remove(); uploadHelp(); return; }
          throw new Error(why === 'forbidden' ? 'Votre rôle ne permet pas d’envoyer des vidéos' : 'Cloudflare a refusé l’envoi (' + why + ')');
        }
        uploading++;

  function attachHls(v, url) {
    let hls = null;

      if (window.Hls && Hls.isSupported()) {
        // Vidéos enregistrées : grande réserve d'avance + qualité adaptée à la taille de l'écran = pas de saccades.
        hls = new Hls({ capLevelToPlayerSize: true, maxBufferLength: 120, maxMaxBufferLength: 600, backBufferLength: 30,
          fragLoadingMaxRetry: 20, fragLoadingRetryDelay: 800, levelLoadingMaxRetry: 20, manifestLoadingMaxRetry: 20 });
        hls.on(Hls.Events.ERROR, (_, d) => { if (!d.fatal) return; if (d.type === Hls.ErrorTypes.NETWORK_ERROR) setTimeout(() => hls.startLoad(), 1000); else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError(); });
        hls.loadSource(url); hls.attachMedia(v);

    return () => { try { hls && hls.destroy(); } catch (e) {} v.removeAttribute('src'); v.load(); };
  }

  // ── Écran antenne : suit exactement la grille, comme chez les spectateurs ──
  function airTarget(t) {

      const src = R.live.source || 'obs', url = (R.live.live_url || '').trim();
      if (src === 'youtube') return { kind: 'embed', key: 'live:' + url + R.mute, url: 'https://www.youtube.com/embed/' + ytId(url) + '?autoplay=1&playsinline=1&rel=0&mute=' + (R.mute ? 1 : 0), live: true, title: 'Direct YouTube en cours' };
      if (src === 'facebook') return { kind: 'embed', key: 'live:' + url + R.mute, url: 'https://www.facebook.com/plugins/video.php?href=' + encodeURIComponent(url) + '&show_text=false&autoplay=true&mute=' + (R.mute ? 1 : 0), live: true, title: 'Direct Facebook en cours' };

      return { kind: 'hls', key: 'live:' + R.live.hls_url, url: R.live.hls_url, live: true, title: 'Direct OBS / vMix en cours' };

    const p = sl.p, key = p.id + '@' + sl.start;
    return p.source === 'youtube' ? { kind: 'yt', key, id: ytId(p.video_url), sl, title: p.title } : { kind: 'hls', key, url: streamUrl(p.video_url), sl, title: p.title };
  }
  function mountAir(T) {

    R.air = { key: T.key, T };
    const host = airBox.firstChild; host.textContent = '';
    if (T.kind === 'none') { host.append(h('div', { class: 'msg' }, h('div', {}, h('b', {}, T.msg[0]), T.msg[1]))); return; }
    const pos = () => T.sl ? (now() - T.sl.start) / 1000 : 0;
    if (T.kind === 'embed') { host.append(h('iframe', { src: T.url, allow: 'autoplay; encrypted-media; picture-in-picture', allowfullscreen: true, title: T.title })); return; }
    if (T.kind === 'yt') {
      const div = h('div'); host.append(div);
      loadYt().then(() => {
        if (R.air.key !== T.key) return;
        const pl = new YT.Player(div, { width: '100%', height: '100%', videoId: T.id,
          playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, playsinline: 1, rel: 0, start: Math.floor(pos()), mute: R.mute ? 1 : 0, origin: location.origin },
          events: { onReady: e => { if (R.air.key !== T.key) return; R.air.yt = pl; applyVol(); e.target.seekTo(pos(), true); e.target.playVideo(); } } });
        if (R.air.key !== T.key) { try { pl.destroy(); } catch (e) {} return; }
        R.air.destroy = () => { try { pl.destroy(); } catch (e) {} };

    } else {

  function applyVol() {

    muteBtn.classList.toggle('primary', !R.mute);
    volIn.value = R.vol;
    const A = R.air;
    if (A.yt) { try { R.mute ? A.yt.mute() : A.yt.unMute(); A.yt.setVolume(R.vol); } catch (e) {} }
    if (A.video) { A.video.muted = R.mute; A.video.volume = R.vol / 100; if (!R.mute) A.video.play().catch(() => {}); }

  let lastSync = 0, lastAlerts = 0;
  function tick(force) {
    if (!R.alive) return;
    const t = now();
    F.clock.textContent = hmsOf(t);
    const T = airTarget(t);
    // Même programme, même moment (à 3 s près, après une modification de la playlist) : on ne recharge rien.
    const same = R.air.T && T.sl && R.air.T.sl && R.air.T.sl.p.id === T.sl.p.id && Math.abs(R.air.T.sl.start - T.sl.start) < 3000 && R.air.T.kind === T.kind;
    if (same) { R.air.T = T; R.air.key = T.key; }
    if (T.key !== R.air.key) mountAir(T);
    if (T.sl && t - lastSync > 15000) {
      lastSync = t;
      const want = (t - T.sl.start) / 1000;
      try {
        if (R.air.yt && R.air.yt.getPlayerState && R.air.yt.getPlayerState() === 1 && Math.abs(R.air.yt.getCurrentTime() - want) > 8) R.air.yt.seekTo(want, true);
        if (R.air.video && R.air.video.readyState > 3 && !R.air.video.paused && Math.abs(R.air.video.currentTime - want) > 10) R.air.video.currentTime = want;
      } catch (e) {}
    }
    drawOverlay(t, T);
    // Aperçu : même habillage que les spectateurs, calé sur la position de la vidéo en aperçu.
    drawPrevOverlay(t, R.prev ? { kind: 'prev', sl: { p: R.prev, start: t - (prevBox.__pos ? prevBox.__pos() : 0) * 1000 } } : { kind: 'none' });
    const st = R.live ? 'live' : R.channel.status;
    airScr.classList.toggle('paused', st === 'paused'); airScr.classList.toggle('stopped', st === 'stopped');
    const lbl = { live: 'DIRECT ' + (LIVE_SRC[(R.live && R.live.source) || 'obs'] || '').toUpperCase(), playing: 'À L’ANTENNE', paused: 'EN PAUSE', stopped: 'ARRÊTÉE' }[st];

    F.pill.className = 'st-pill ' + st; F.pill.lastChild.textContent = { live: 'EN DIRECT', playing: 'À L’ANTENNE', paused: 'EN PAUSE', stopped: 'CHAÎNE ARRÊTÉE' }[st];

    if (T.sl) {

  // ── Données ──
  async function reload() {
    const [pr, ch] = await Promise.all([
      sb.from('tv_programs').select('*').order('position').order('created_at'),
      sb.from('tv_channel').select('*').eq('id', 1).maybeSingle(),
    ]);
    if (!R.alive) return;
    if (pr.error) return toast(friendly(pr.error), true);
    R.programs = pr.data || [];
    if (ch.data) R.channel = ch.data;
    draw();
    checkReady();
  }
  async function checkReady() {
    for (const p of R.programs) {
      if (p.source !== 'file' || R.ready[p.id] === true) continue;
      const ok = await manifestReady(streamUrl(p.video_url));
      if (R.ready[p.id] !== ok) { R.ready[p.id] = ok; if (R.alive) draw(); }
    }
  }
  async function loadLive() {
    const { data } = await sb.from('live_stream').select('*').limit(1).maybeSingle();
    R.liveRow = data || null;
    await probeLive();
  }
  async function probeLive() {
    const d = R.liveRow; let on = false;
    if (d && d.is_live && (d.source || 'obs') !== 'obs') on = !!(d.live_url || '').trim();
    else if (d && d.is_live && d.hls_url) {
      try { const r = await fetch(d.hls_url, { cache: 'no-store' }); on = r.status === 200 && (await r.text()).includes('#EXT'); } catch (e) {}
    }
    const was = !!R.liveIdle;
    R.live = on ? d : null;
    R.liveIdle = !!(d && d.is_live && !on);
    drawLive();
    if (was !== R.liveIdle && R.sched) drawAlerts();
  }
  try {
    const sent = Date.now(); const { data } = await sb.rpc('tv_now'); const got = Date.now();
    if (data) R.offset = Date.parse(data) - (sent + (got - sent) / 2);
  } catch (e) {}
  await loadLive();
  await loadBrand();
  await reload();
  applyVol();
  const timer = setInterval(tick, 250);
  const readyTimer = setInterval(checkReady, 30000);
  const liveTimer = setInterval(probeLive, 15000);
  const rt = sb.channel('regie-' + Date.now())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tv_programs' }, () => reload())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tv_channel' }, p => { if (p.new && p.new.id) { R.channel = p.new; draw(); } })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'live_stream' }, () => loadLive().then(() => tick(true)))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tv_branding' }, p => { if (Date.now() - brandEdit > 4000 && p.new && p.new.config) { R.brand = normBrand(p.new.config); buildHab(); } })
    .subscribe();
  const frameLeave = window.__leave;
  window.__leave = () => {
    R.alive = false; clearInterval(timer); clearInterval(readyTimer); clearInterval(liveTimer);
    try { sb.removeChannel(rt); } catch (e) {}
    if (R.air.destroy) try { R.air.destroy(); } catch (e) {}
    if (prevBox.__destroy) try { prevBox.__destroy(); } catch (e) {}
    if (frameLeave) frameLeave();
  };
}

    const { data, error } = await sb.from('tv_backups').select('id,created_at,kind,who,n').order('created_at', { ascending: false }).limit(40);
    backups.textContent = '';
    if (error) return backups.append(h('div', { class: 'bad' }, friendly(error)));
    if (!data.length) return backups.append(h('div', { class: 'rg-small' }, 'Pas encore de copie.'));
    for (const b of data) {
      const kind = b.kind === 'auto' ? 'automatique' : b.kind === 'manuelle' ? 'faite par ' + (b.who || 'un administrateur') : b.kind;
      backups.append(h('div', { class: 'tm-bk' },
        h('span', {}, h('b', {}, fmtDate(b.created_at)), h('small', {}, `${kind} · ${b.n} programme${b.n > 1 ? 's' : ''}`)),
        h('button', { class: 'btn small', onclick: async () => {
          if (!(await confirmBox(`Remettre la programmation telle qu’elle était le ${fmtDate(b.created_at)} (${b.n} programmes) ? La programmation actuelle sera remplacée, mais une copie en est gardée juste avant.`, 'Restaurer'))) return;
          const { data: n, error } = await sb.rpc('tv_backup_restore', { p_id: b.id });
          if (error) return toast(friendly(error), true);
          toast(`Programmation restaurée : ${n} programmes.`); loadBackups(); loadLog();
        } }, 'Restaurer')));
    }
  }
  async function exportFile() {
    const { data, error } = await sb.from('tv_programs').select('*').order('position').order('created_at');
    if (error) return toast(friendly(error), true);
    const blob = new Blob([JSON.stringify({ app: 'conacce-tv', exported_at: new Date().toISOString(), programs: data }, null, 2)], { type: 'application/json' });
    const a = h('a', { href: URL.createObjectURL(blob), download: `conacce-tv-programmation-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(a); a.click(); a.remove();
    toast('Fichier téléchargé : gardez-le en lieu sûr.');
  }
  function importFile() {
    const inp = h('input', { type: 'file', accept: '.json,application/json', class: 'hidden' });
    inp.onchange = async () => {
      const f = inp.files[0]; inp.remove(); if (!f) return;
      let json; try { json = JSON.parse(await f.text()); } catch (e) { return toast('Ce fichier n’est pas une sauvegarde Conacce TV.', true); }
      const list = Array.isArray(json) ? json : json && json.programs;
      if (!Array.isArray(list)) return toast('Ce fichier n’est pas une sauvegarde Conacce TV.', true);
      if (!(await confirmBox(`Remplacer toute la programmation par celle du fichier (${list.length} programmes) ? Une copie de la programmation actuelle est gardée juste avant.`, 'Importer'))) return;
      const { data: n, error } = await sb.rpc('tv_backup_import', { p: { programs: list } });
      if (error) return toast(friendly(error), true);
      toast(`Programmation importée : ${n} programmes.`); loadBackups(); loadLog();
    };
    document.body.append(inp); inp.click();
  }

  main.append(h('div', { class: 'tm' },
    h('section', { class: 'st-card tm-team', 'aria-label': 'Comptes de la régie' },
      h('div', { class: 'st-card-head' }, h('h2', {}, 'Comptes de la régie'), places),
      accounts, addBox,
      h('div', { class: 'tm-roles' },
        h('div', { class: 'admin' }, h('b', {}, 'Administrateur'), 'Tout : programmes, directs, comptes, sauvegardes, tout effacer.'),
        h('div', { class: 'editeur' }, h('b', {}, 'Éditeur'), 'Ajoute et programme les vidéos, pilote la chaîne. Ne peut pas tout effacer ni gérer les comptes.'),
        h('div', { class: 'animateur' }, h('b', {}, 'Animateur'), 'Lance et arrête les directs. Voit la grille sans la modifier.')),
      h('h3', {}, 'Journal des actions'), log),
    h('section', { class: 'st-card tm-save', 'aria-label': 'Sauvegarde en ligne' },
      h('div', { class: 'st-card-head' }, h('h2', {}, 'Sauvegarde en ligne')),
      h('div', { class: 'st-alert ok' }, icon('cloud', 22), h('span', {}, h('b', {}, 'Tout est enregistré en ligne, à chaque changement. '), 'Si l’ordinateur tombe en panne, connectez-vous depuis un autre : tout est là. En plus, une copie de la programmation est faite chaque matin et avant chaque « Tout supprimer », gardée 30 jours.')),
      h('div', { class: 'tm-btns' },
        h('button', { class: 'btn small primary', onclick: async () => { const { error } = await sb.rpc('tv_backup_now'); if (error) return toast(friendly(error), true); toast('Copie faite.'); loadBackups(); loadLog(); } }, 'Faire une copie maintenant'),
        h('button', { class: 'btn small', onclick: exportFile }, 'Télécharger la programmation'),
        h('button', { class: 'btn small', onclick: importFile }, 'Importer un fichier')),
      h('h3', {}, 'Points de restauration'), backups)));
  loadTeam(); loadLog(); loadBackups();
}

const NAV = [
  ['dash', 'Général', 'Tableau de bord'],
  ['live', 'Diffusion', 'TV en direct'], ['regie', '', 'Régie TV (programmation)'], ['radio', '', 'Radio Dunamis FM'],
  ['sermons', 'Contenus', 'Vidéos'], ['featured', '', 'Grand écran de l’accueil'], ['worship', '', 'Musique'], ['audio', '', 'Audio'], ['gallery', '', 'Galerie photo'], ['works', '', 'Œuvres d’Or'], ['banners', '', 'Affiches de l’accueil'],
  ['comments', 'Échanges', 'Commentaires du direct'], ['inbox', '', 'Messagerie (contact)'],
  ['settings', 'Paramètres', 'Réglages'], ['team', '', 'Équipe et sauvegarde'],
];
let current = null, me = null;

function show(key, arg) {
  if (key === 'tv') key = 'regie';
  if (!can.admin && key !== 'regie') key = 'regie';
  if (window.__leave) { try { window.__leave(); } catch (e) {} window.__leave = null; }
  current = key;
  history.replaceState(null, '', '#' + key);
  document.querySelectorAll('button.nav').forEach(b => b.classList.toggle('on', b.dataset.k === key));
  const main = $('#main'); main.textContent = ''; window.scrollTo(0, 0);
  const app = $('.app'); if (app) app.classList.toggle('studio', key === 'regie' || key === 'team');
  if (ENT[key]) return showList(key);
  ({ regie: showRegie, dash: showDash, live: showLive, comments: showComments, inbox: showInbox, radio: showRadio, settings: showSettings, team: showTeam })[key](arg);
}

function shell(user) {
  const root = $('#root'); root.textContent = '';
  if (!can.admin) {
    // Éditeurs et animateurs : la régie seulement.
    root.append(h('div', { class: 'app studio' }, h('main', { id: 'main' })));
    return show('regie');
  }
  root.append(h('div', { class: 'app' },
    h('nav', { class: 'side' },
      h('div', { class: 'brand' }, h('img', { src: '../assets/assets/images/logo.png', alt: 'Conacce TV' }), h('div', {}, 'ADMINISTRATION')),
      NAV.flatMap(([k, g, l]) => [g ? h('div', { class: 'group' }, g) : null, h('button', { class: 'nav', 'data-k': k, onclick: () => show(k) }, l)]),
      h('div', { class: 'spacer' }),
      h('div', { class: 'who' }, userLabel(user.email)),
      h('button', { class: 'nav', onclick: async () => { await sb.auth.signOut(); location.hash = ''; boot(); } }, 'Se déconnecter')),
    h('div', { class: 'content' },
      h('div', { class: 'topbar' },
        h('b', {}, 'Conacce TV'),
        h('a', { href: '../', target: '_blank', rel: 'noopener' }, 'Voir l’appli'),
        h('span', { class: 'grow' }),
        h('span', {}, 'Bonjour, ', h('b', {}, userLabel(user.email)))),
      h('main', { id: 'main' }))));
  const start = location.hash.slice(1);
  show(NAV.some(n => n[0] === start) ? start : 'dash');
}

// Connexion par nom d'utilisateur + mot de passe (le nom est converti en identifiant interne).
const ADMIN_DOMAIN = 'admin.conacce-tv.app';
const toLogin = u => {
  u = String(u || '').trim();
  if (u.includes('@')) return u.toLowerCase();
  const slug = u.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9._-]+/g, '.').replace(/^[.]+|[.]+$/g, '');
  return slug ? slug + '@' + ADMIN_DOMAIN : '';
};
const userLabel = e => String(e || '').endsWith('@' + ADMIN_DOMAIN) ? String(e).split('@')[0] : e;

function loginScreen(msg) {
  const root = $('#root'); root.textContent = '';
  let mode = 'login';
  const user = h('input', { type: 'text', placeholder: 'Nom d’utilisateur', autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false', required: true });
  const pass = h('input', { type: 'password', placeholder: 'Mot de passe (6 caractères minimum)', autocomplete: 'current-password', required: true, style: 'margin-top:10px' });
  const pass2 = h('input', { type: 'password', placeholder: 'Retapez le mot de passe', autocomplete: 'new-password', style: 'margin-top:10px' });
  const btn = h('button', { class: 'btn primary', style: 'width:100%;margin-top:12px' });
  const info = h('p', {});
  const tabs = h('div', { class: 'quick', style: 'justify-content:center;margin:10px 0 4px' });
  const modes = [['login', 'Se connecter'], ['signup', 'Créer mon compte']];
  const texts = {
    login: 'Entrez votre nom d’utilisateur et votre mot de passe.',
    signup: 'Choisissez vous-même votre nom d’utilisateur et votre mot de passe. Gardez-les précieusement.',
  };
  function draw() {
    tabs.textContent = '';
    for (const [k, l] of modes) tabs.append(h('button', { type: 'button', class: 'btn small ' + (mode === k ? 'primary' : 'ghost'), onclick: () => { mode = k; msg = null; draw(); } }, l));
    pass2.classList.toggle('hidden', mode !== 'signup');
    pass2.required = mode === 'signup';
    pass.autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
    btn.textContent = mode === 'signup' ? 'Créer mon compte' : 'Se connecter';
    info.textContent = msg || texts[mode];
  }
  const form = h('form', { onsubmit: async e => {
    e.preventDefault();
    const name = user.value.trim(), login = toLogin(name), pw = pass.value, label = btn.textContent;
    if (!login) return toast('Choisissez un nom d’utilisateur (lettres et chiffres).', true);
    if (pw.length < 6) return toast('Le mot de passe doit faire au moins 6 caractères.', true);
    if (mode === 'signup' && pw !== pass2.value) return toast('Les deux mots de passe ne sont pas identiques.', true);
    btn.disabled = true; btn.textContent = 'Patientez…';
    try {
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email: login, password: pw });
        if (error) throw error;
        return boot();
      }
      const { data, error } = await sb.auth.signUp({ email: login, password: pw, options: { data: { display_name: name } } });
      if (error) throw error;
      if (data.session) return boot();
      mode = 'login';
      msg = 'Compte « ' + name + ' » créé. Il doit être activé une fois par l’administrateur technique ; ensuite connectez-vous ici.';
      draw();
    } catch (err) {
      const m = String(err && err.message || err);
      toast(/invalid login/i.test(m) ? 'Nom d’utilisateur ou mot de passe incorrect.' : /not confirmed/i.test(m) ? 'Ce compte n’est pas encore activé.' : friendly(err), true);
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  } }, user, pass, pass2, btn);
  draw();
  root.append(h('div', { class: 'center' }, h('div', { class: 'login' },
    h('img', { class: 'logo', src: '../assets/assets/images/logo.png', alt: 'Conacce TV' }),
    h('h1', { style: 'text-align:center;margin-bottom:6px' }, 'Administration'), tabs, info, form)));
}

function deniedScreen(user) {
  const root = $('#root'); root.textContent = '';
  root.append(h('div', { class: 'center' }, h('div', { class: 'login' },
    h('img', { class: 'logo', src: '../assets/assets/images/logo.png', alt: 'Conacce TV' }),
    h('h1', { style: 'text-align:center' }, 'Accès réservé'),
    h('p', {}, 'Vous êtes connecté avec ', h('b', {}, userLabel(user.email)), ', mais ce compte n’a pas encore accès à la régie.'),
    h('p', {}, 'Donnez votre nom d’utilisateur à l’administrateur : il vous donnera l’accès dans « Équipe et sauvegarde ». Rechargez ensuite cette page.'),
    h('div', { style: 'display:flex;gap:10px' },
      h('button', { class: 'btn primary', onclick: () => location.reload() }, 'Recharger'),
      h('button', { class: 'btn', onclick: async () => { await sb.auth.signOut(); boot(); } }, 'Changer de compte')))));
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    const err = new URLSearchParams(location.hash.slice(1)).get('error_description');
    return loginScreen(err ? 'Ce lien a expiré. Connectez-vous avec votre nom d’utilisateur et votre mot de passe.' : null);
  }
  me = session.user;
  const { data, error } = await sb.from('app_users').select('role,staff,is_owner,display_name').eq('id', me.id).maybeSingle();
  if (error) return loginScreen(friendly(error));
  ROLE = !data ? null : data.is_owner ? 'owner' : data.role === 'admin' ? 'admin' : data.staff || null;
  myName = (data && data.display_name) || userLabel(me.email);
  if (!ROLE) return deniedScreen(me);
  if (can.admin) await loadRefs();
  shell(me);
}

let booted = false;
sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN' && booted && !me) setTimeout(boot, 0);
});
boot().finally(() => { booted = true; });
</script>
</body>
