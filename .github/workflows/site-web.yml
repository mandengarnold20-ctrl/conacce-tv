# Publie automatiquement la version web de Conacce TV (iPhone, ordinateur…)
# sur https://mandengarnold20-ctrl.github.io/conacce-tv/ à chaque modification,
# et prépare une copie (branche cf-pages) pour Cloudflare : tv.conaccechaplainsafrique.com
name: Site web Conacce TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Télécharger les dépendances
        run: flutter pub get
      - name: Fabriquer le site
        run: flutter build web --release --base-href /conacce-tv/
      - name: Polices de l'habillage chargées seulement à la demande (pas au démarrage)
        run: if [ -f build/web/flutter_service_worker.js ]; then sed -i '/^"fonts\//d' build/web/flutter_service_worker.js; fi
      - name: Lecteur vidéo (hls.js) et moteur d'affichage servis depuis notre propre adresse
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js -o build/web/hls.min.js
          test -s build/web/hls.min.js
          test -d build/web/canvaskit
      - name: Page de secours
        run: cp build/web/index.html build/web/404.html
      - name: Copie pour Cloudflare (adresse à la racine du domaine)
        run: |
          rm -rf cf && cp -r build/web cf
          sed -i 's#<base href="/conacce-tv/">#<base href="/">#' cf/index.html cf/404.html cf/admin/index.html 2>/dev/null || true
          cd cf
          git init -q -b cf-pages
          git config user.name "Conacce TV"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Site web ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cf-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
