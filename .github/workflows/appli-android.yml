# Fabrique l'appli Android de Conacce TV (fichier .apk à installer sur un téléphone pour les essais).
# Le fichier se télécharge dans l'onglet « Actions » › dernière fabrication › « Artifacts » › conacce-tv-android.
# Cette fabrication est indépendante du site web : si elle échoue, le site continue d'être publié.
name: Appli Android Conacce TV

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'tool/patch_android.py'
      - '.github/workflows/appli-android.yml'
  workflow_dispatch:

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Créer le dossier Android
        run: flutter create . --org com.conacce --project-name conacce_tv --platforms android
      - name: Réglages Android (nom, icône, audio en arrière-plan)
        run: python3 tool/patch_android.py
      - name: Télécharger les dépendances
        run: flutter pub get
      - name: Fabriquer l'APK d'essai
        run: flutter build apk --release
      - name: Renommer
        run: cp build/app/outputs/flutter-apk/app-release.apk conacce-tv-essai.apk
      - uses: actions/upload-artifact@v4
        with:
          name: conacce-tv-android
          path: conacce-tv-essai.apk
          retention-days: 30
